name: Publish package

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright-version
        run: |
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The same tarball `pnpm publish` would build, so the publish job needs no pnpm.
      - run: pnpm pack --out package.tgz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package.tgz
          if-no-files-found: error
          retention-days: 1

  # Can publish to npm, so it installs nothing and runs no project code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # npm's trusted publisher accepts only this environment, which only v* tags can deploy to
    environment: npm
    permissions:
      # npm trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # npm stage needs npm 11.15 or later, which Node 24.18 and later bundle.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      # A maintainer approves the staged version on npmjs.com before it goes live.
      - run: npm stage publish ./package.tgz --ignore-scripts --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'beta' || 'latest' }}
